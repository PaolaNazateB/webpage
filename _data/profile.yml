short_bio: >-
  <p>
    I am a Ph.D. candidate in Electrical Engineering at Pontificia Universidad Católica de Chile.
  </p>
  <p>
    My research focuses on autonomous robotic systems for unstructured and outdoor environments, with emphasis on SLAM, sensor fusion under GNSS-denied conditions, and multimodal perception using LiDAR, radar, RGB, and inertial sensors.
  </p>
  <p>
    I am particularly interested in agricultural robotics, environmental monitoring, and distributed sensing systems for real-world deployment.
  </p>

