  <p>
    My research centers on SLAM, sensor fusion under GNSS-denied conditions, and multimodal perception using lidar, radar, RGB, and inertial sensors.
    I am particularly interested in agricultural robotics, environmental monitoring, and smart sensing systems for natural resource management.
